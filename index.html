<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- STYLE SHEET -->
    <link rel="stylesheet" href="style.css">
    <!-- FONT FAMILY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">
        <h1>Registration Form</h1>

        <form id="form" class="form">
            <label>Name</label><br>
            <input type="text" id="name" placeholder="Enter Your Name"><br>
            <p class="error" id="nameError"></p>

            <label>Email</label><br>
            <input type="email" id="email" placeholder="Enter Your Email"><br>
            <p class="error" id="emailError"></p>

            <label>Password</label><br>
            <input type="password" id="password" placeholder="Enter Password"><br>
            <p class="error" id="passwordError"></p>

            <label>Bio</label><br>
            <textarea name="bio" id="bio" maxlength="200" required placeholder="Write a Message"></textarea><br>
            <p id="bioError" class="error"></p>
            <p class="bioCount" id="bioCount"></p>

            <button type="submit" class="btn" id="btn" disabled>Submit</button>
        </form>

        <p id="successMessage"></p>
        
    </div>

    <script src="script.js"></script>
</body>

</html>
